type User @table {
  username: String!
  email: String
  displayName: String
  createdAt: Timestamp!
}

type Category @table {
  user: User!
  name: String!
  description: String
}

type TBDItem @table {
  user: User!
  title: String!
  description: String
  tentativeDueDate: Date
  priority: String
  category: Category
  status: String!
  createdAt: Timestamp!
}

type Note @table {
  user: User!
  tbdItem: TBDItem!
  content: String!
  createdAt: Timestamp!
}