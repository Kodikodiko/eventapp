  const hours = []; for (let m = 0; m <= 10.5 * 60; m += 30) hours.push(m);

    <section class="flex w-[320px] shrink-0 flex-col border-r border-line bg-white">

      <div class="mt-3 grid grid-cols-3 gap-1 px-4 text-center text-xs">${[['Angefragt', SP.filter((s) => s.status !== 'confirmed').length, 'text-warn'], ['Zugesagt', SP.filter((s) => s.status === 'confirmed').length, 'text-ok'], ['Folien fehlen', SP.filter((s) => !s.slides).length, 'text-bad']].map(([t, n, c]) => `<span class="rounded-lg bg-canvas py-1.5"><span class="num block text-base font-bold ${c}">${n}</span>${t}</span>`).join('')}</div>
      <div class="scroll-thin mt-3 flex-1 overflow-auto px-2">
        ${sp.map((s, i) => `<div class="flex items-center gap-2.5 rounded-lg px-2 py-1.5 hover:bg-canvas ${i === 3 ? 'bg-brand-50 ring-1 ring-brand' : ''}">
          ${s.photo ? `<img src="${MEDIA + s.photo}" class="size-8 rounded-full object-cover" alt="">` : `<span class="flex size-8 items-center justify-center rounded-full bg-brand-100 text-[11px] font-bold text-brand">${initials(s.name)}</span>`}
          <span class="min-w-0 flex-1"><span class="block truncate text-sm font-semibold">${esc(s.name)}</span><span class="block truncate text-xs text-ink-3">${esc(s.company || '')}</span></span>
          <span class="flex items-center gap-1">${s.slides ? '' : '<span class="rounded bg-bad-bg px-1.5 text-[11px] font-semibold text-bad">Folien</span>'}</span>
        </div>`).join('')}
      </div>
    </section>
    <section class="flex min-w-0 flex-1 flex-col">
      <div class="flex items-center gap-3 px-6 pt-5">
        <h1 class="font-display text-[28px] font-extrabold tracking-tight">Programm</h1>
        <span class="rounded-full bg-ok-bg px-2 py-0.5 text-xs font-semibold text-ok">veröffentlicht</span>
        <div class="ml-auto flex gap-2"><button class="flex items-center gap-1.5 rounded-lg border border-line bg-white px-3 py-1.5 text-sm font-medium">${ic('print')}Druck</button><button class="flex items-center gap-1.5 rounded-lg bg-brand px-3 py-1.5 text-sm font-semibold text-white">${ic('plus')}Programmpunkt</button></div>
      </div>
      <div class="mt-3 flex items-center gap-2 px-6 text-sm"><span class="rounded-lg bg-ink px-3 py-1 font-semibold text-white">Di, 3. Nov</span><span class="rounded-lg px-3 py-1 text-ink-3">Mo, 2. Nov · Masterclass</span>
        <span class="ml-auto flex items-center gap-1.5 rounded-lg bg-warn-bg px-2.5 py-1 text-xs font-semibold text-warn">${ic('alert', 'size-3.5')}Folien: 0 von 16 da · Erinnerung an alle senden</span></div>
      <div class="mt-3 grid grid-cols-[56px_1fr] px-6 text-xs font-semibold text-ink-3"><span></span><div class="grid grid-cols-3">${streams.map((s) => `<span class="px-2">${s}</span>`).join('')}</div></div>
      <div class="scroll-thin min-h-0 flex-1 overflow-auto px-6 pb-16">
        <div class="relative grid grid-cols-[56px_1fr]" style="height:${totalH}px">
          <div class="relative">${hours.map((m) => `<span class="num absolute right-2 -translate-y-1/2 text-xs text-ink-3" style="top:${m * PX}px">${tm(t0 + m * 60000)}</span>`).join('')}</div>
          <div class="relative rounded-xl border border-line bg-white/60">
            ${hours.map((m) => `<div class="absolute inset-x-0 border-t ${m % 60 ? 'border-dashed border-line/60' : 'border-line'}" style="top:${m * PX}px"></div>`).join('')}
            <div class="absolute inset-y-0 left-1/3 border-l border-line"></div><div class="absolute inset-y-0 left-2/3 border-l border-line"></div>
            ${blocks}

    ${ann(14, 'Speaker und Programm in einer Ansicht: Status, Folien und Einsätze auf einen Blick', 'top:120px;left:470px')}
    ${ann(15, 'Echte Zeitachse: Länge = Dauer, Lücken sichtbar; Programmpunkte per Ziehen verschieben', 'top:330px;right:40px')}
    ${ann(16, 'Offene Punkte (Folien, Doppelbelegung eines Speakers oder Raums) stehen oben, mit Aktion', 'top:118px;right:40px')}
  </div>`, ['Forum Day 2026', '03.11.2026 · Wien']);
}

// ---------- Rechnungen ----------
function screenRechnungen() {
  const inv = D.invoices.map((i) => ({ ...i, r: JSON.parse(i.recipient || '{}') }));
  const main = inv.filter((i) => i.type !== 'credit_note');
  const cn = inv.filter((i) => i.type === 'credit_note');
  const od = (i) => i.ps === 'open' && i.rstatus !== 'cancelled' && i.due && new Date(i.due) < TODAY;
  const st = (i) => i.rstatus === 'cancelled' ? ['Storniert', 'text-ink-3 bg-[#EEEDE9]'] : od(i) ? ['Überfällig', 'text-bad bg-bad-bg'] : i.ps === 'paid' ? ['Bezahlt', 'text-ok bg-ok-bg'] : i.ps === 'open' ? ['Offen', 'text-warn bg-warn-bg'] : ['Erstattet', 'text-ink-2 bg-[#EEEDE9]'];
  const sum = (l) => l.reduce((a, i) => a + i.gross, 0);
  const lOd = main.filter(od), lOpen = main.filter((i) => i.ps === 'open' && i.rstatus !== 'cancelled' && !od(i)), lPaid = main.filter((i) => i.ps === 'paid');
  const rows = lOd.slice(0, 14).map((i) => {
    const days = i.due ? Math.round((TODAY - new Date(i.due)) / 864e5) : 0;
    const credits = cn.filter((c) => c.rel === i.id);
    return `<tr class="border-b border-line/70 ${od(i) ? 'bg-bad-bg/30' : ''}">
      <td class="pl-4"><span class="flex size-4 items-center justify-center rounded border border-brand bg-brand text-white">${ic('check', 'size-3')}</span></td>
      <td class="num py-2 pr-3 font-semibold">${i.number}</td>
      <td class="py-2 pr-3"><span class="font-medium">${esc(i.r.company || i.r.name)}</span>${i.r.company ? `<span class="ml-2 text-xs text-ink-3">${esc(i.r.name)}</span>` : ''}</td>
      <td class="num py-2 pr-3 text-right">${eur(i.gross)}</td>
      <td class="py-2 pr-3">${pill(st(i)[1], st(i)[0])}</td>
      <td class="num py-2 pr-3 text-sm ${od(i) ? 'font-semibold text-bad' : 'text-ink-3'}">${od(i) ? `seit ${days} Tagen` : i.due ? new Date(i.due).toLocaleDateString('de-AT') : '–'}</td>
      <td class="py-2 pr-3 text-sm text-ink-3">${credits.length ? `<span class="inline-flex items-center gap-1 rounded-md border border-line bg-white px-1.5 py-px text-xs">${ic('undo', 'size-3')}Gutschrift ${credits[0].number} · ${eur(credits[0].gross)}</span>` : od(i) ? 'noch keine Erinnerung' : ''}</td>
      <td class="pr-4 text-right text-ink-3">${ic('more')}</td></tr>`;
  }).join('');
  const nOd = main.filter(od).length;
  return shell('rechnungen', `<div class="h-full overflow-hidden">
    <div class="flex items-end justify-between px-8 pt-6"><div><h1 class="font-display text-[28px] font-extrabold tracking-tight">Rechnungen</h1><p class="mt-1 text-sm text-ink-3">Rechnungen und Gutschriften zusammen, Gutschriften hängen an ihrer Rechnung</p></div>
      <button class="flex items-center gap-2 rounded-lg border border-line bg-white px-3 py-2 text-sm font-medium">${ic('download')}Export für Buchhaltung</button></div>
    <div class="mt-5 grid grid-cols-4 gap-3 px-8">
      ${[['Handlungsbedarf', `${nOd} überfällig`, eur(sum(lOd)), 'border-bad ring-1 ring-bad', 'text-bad'], ['Offen, noch nicht fällig', `${lOpen.length} Rechnung`, eur(sum(lOpen)), 'border-line', 'text-warn'], ['Bezahlt', `${lPaid.length} Rechnungen`, eur(sum(lPaid)), 'border-line', 'text-ok'], ['Gutschriften', `${cn.length} Stück`, '− ' + eur(sum(cn)), 'border-line', 'text-ink-2']].map(([t, s, v, b, c]) => `<button class="rounded-xl border bg-white p-4 text-left shadow-sm ${b}"><span class="block text-sm text-ink-3">${t}</span><span class="num mt-1 block font-display text-2xl font-bold ${c}">${v}</span><span class="block text-xs text-ink-3">${s}</span></button>`).join('')}
    </div>
    <div class="mx-8 mt-4 flex items-center gap-3 rounded-xl bg-ink px-4 py-2.5 text-sm text-white">
      <span class="font-semibold"><span class="num">${nOd}</span> überfällige ausgewählt</span><span class="text-white/70">Erinnerungen laufen automatisch alle 7 Tage</span>
      <button class="ml-auto flex items-center gap-1.5 rounded-lg bg-white px-3 py-1.5 font-semibold text-ink">${ic('send')}Jetzt erinnern</button><button class="rounded-lg px-3 py-1.5 hover:bg-white/10">Als bezahlt markieren</button></div>
    <div class="mx-8 mt-3 overflow-hidden rounded-xl border border-line bg-white shadow-sm"><table class="w-full text-left">
      <thead class="bg-[#FAF9F6] text-xs font-semibold text-ink-3"><tr class="border-b border-line"><th class="w-10 py-2.5 pl-4"></th><th class="pr-3">Nummer</th><th class="pr-3">Empfänger</th><th class="pr-3 text-right">Betrag</th><th class="pr-3">Status</th><th class="pr-3">Fällig</th><th class="pr-3">Zuletzt</th><th></th></tr></thead>
      <tbody class="text-sm">${rows}</tbody></table></div>
    ${ann(17, 'Kacheln sind Filter. Start immer bei „Handlungsbedarf“ statt bei 100 Belegen', 'top:110px;left:520px')}
    ${ann(18, 'Mahnen als Massenaktion statt einzeln über „…“', 'top:258px;right:200px')}
    ${ann(19, 'Gutschriften hängen an ihrer Rechnung statt als eigene Zeile (Ansicht „Alle“)', 'top:420px;right:120px')}
  </div>`);
}

// ---------- Check-in (mobil) ----------
function screenCheckin() {
  const conf = regs.filter((r) => r.status === 'confirmed').slice(0, 9);
  return `<div class="flex h-screen w-full items-center justify-center gap-16 bg-[#E9E7E1]">
    <div class="max-w-sm"><h1 class="font-display text-3xl font-extrabold tracking-tight">Check-in am Eventtag</h1>
      <p class="mt-3 text-ink-2">Neu (TODO UI4). Läuft auf dem Handy oder Tablet am Einlass. Die Datenbank hat dafür schon <code class="rounded bg-white px-1">checked_in_at</code> und einen QR-Code je Anmeldung, es fehlt nur die Oberfläche.</p>
      <ul class="mt-5 space-y-2 text-sm text-ink-2"><li>• Name tippen oder QR-Code vom Ticket scannen</li><li>• Ein Tipp checkt ein, Rückgängig 5 Sekunden lang</li><li>• Hinweise direkt sichtbar: Zahlung offen, Warteliste, Speaker</li><li>• Nachmeldung vor Ort mit der Schnell-Anmeldung</li><li>• Live-Zähler für die Organisation</li></ul></div>
    <div class="relative h-[800px] w-[390px] overflow-hidden rounded-[44px] border-[10px] border-ink bg-canvas shadow-pop">
      <div class="bg-side px-5 pb-4 pt-10 text-white">
        <div class="flex items-center justify-between text-sm"><span class="font-semibold">Herbstforum 2026</span><span class="text-side-fg">Einlass</span></div>
        <div class="mt-3 flex items-end gap-2"><span class="num font-display text-5xl font-extrabold">41</span><span class="mb-1.5 text-side-fg">von 73 da</span><span class="num mb-1.5 ml-auto text-sm text-side-fg">56 %</span></div>
        <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-white/15"><div class="h-full w-[56%] rounded-full bg-[#7BE0A8]"></div></div>
      </div>
      <div class="flex gap-2 p-3"><div class="flex flex-1 items-center gap-2 rounded-xl border border-line bg-white px-3 py-3 text-ink-3">${ic('search', 'size-5')}Name oder Firma</div><button class="flex items-center justify-center rounded-xl bg-brand px-4 text-white">${ic('qr', 'size-6')}</button></div>
      <div class="space-y-1.5 px-3">
        ${conf.map((r, i) => `<div class="flex items-center gap-3 rounded-xl ${i < 3 ? 'bg-white/60' : 'bg-white'} px-3 py-3 shadow-sm">
          <span class="min-w-0 flex-1"><span class="block truncate font-semibold ${i < 3 ? 'text-ink-3' : ''}">${esc(r.fn)} ${esc(r.ln)}</span><span class="block truncate text-xs text-ink-3">${esc(r.company || '–')}${r.ps === 'open' ? ' · <span class="font-semibold text-warn">Zahlung offen</span>' : ''}${(r.roles || '').includes('speaker') ? ' · <span class="font-semibold text-[#C2185B]">Speaker</span>' : ''}</span></span>
          ${i < 3 ? `<span class="flex items-center gap-1 text-sm font-semibold text-ok">${ic('check')}09:${12 + i * 3}</span>` : '<button class="rounded-lg border-2 border-brand px-3 py-1.5 text-sm font-bold text-brand">Einchecken</button>'}
        </div>`).join('')}
      </div>
      <div class="absolute inset-x-3 bottom-4 flex items-center gap-3 rounded-2xl bg-ink px-4 py-3 text-sm text-white shadow-pop">${ic('check', 'size-5 text-[#7BE0A8]')}<span class="flex-1">Martin Czerny eingecheckt</span><button class="font-semibold underline underline-offset-4">Rückgängig</button></div>
    </div></div>`;
}

const SCREENS = [
  ['tn', 'Teilnehmende', screenTn], ['tn-filter', 'Filter', screenTnFilter], ['tn-detail', 'Detail', screenTnDetail], ['tn-bulk', 'Massenbearbeitung', screenTnBulk], ['tn-neu', 'Anmeldung', screenTnNew],
  ['programm', 'Programm & Speaker', screenProgramm], ['rechnungen', 'Rechnungen', screenRechnungen], ['checkin', 'Check-in', screenCheckin],
];
function render() {
  const key = (location.hash || '#tn').slice(1).split('?')[0];
  const s = SCREENS.find((x) => x[0] === key) || SCREENS[0];
  document.getElementById('app').innerHTML = s[2]();
  document.getElementById('switcher').innerHTML = SCREENS.map(([k, t]) => `<a href="#${k}" class="rounded-full px-3 py-1.5 ${k === s[0] ? 'bg-white text-ink' : 'hover:bg-white/10'}">${t}</a>`).join('') + '<button onclick="document.body.classList.toggle(\'no-ann\')" class="rounded-full px-3 py-1.5 text-[#FFE36E] hover:bg-white/10">Notizen</button>';
  document.body.classList.toggle('no-ann', location.hash.includes('clean'));
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
